name: Release / Mirror the downloads

# Copy a published release to releases.nabi-lang.org (scripts/release/mirror.sh),
# where NABI_DIST can point when GitHub is slow or blocked. release.yml
# calls it after the smoke test; dispatch it by hand to mirror an older
# release again. Skipped until the mirror environment has its R2 secrets.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "The published version to mirror, X.Y.Z or X.Y.Z-rc.N"
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  mirror:
    name: Mirror to releases.nabi-lang.org
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: mirror
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::the mirror environment has no R2 credentials yet; skipped"
            exit 0
          fi
          scripts/release/mirror.sh "$VERSION"
