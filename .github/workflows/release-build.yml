name: Release / Build archives

# Build the host archives of one commit and verify the set
# (scripts/release/publish.sh --dir dist); publishes nothing. macOS/Windows run
# dist/native.sh; Linux gnu/musl run the container scripts; FreeBSD runs
# dist/freebsd.sh, dist/native.sh in a FreeBSD VM on a Linux runner (KVM).
# release-ready dispatches it as the release dry run; release.yml reuses
# those dist-* artifacts, or calls it when they are gone. packages=none
# builds archives without the official packages (NABI_DIST_PACKAGES=0,
# dist/native.sh); the run name says so, and so does each build's
# packages-<name> file (scripts/release/dist.sh), so a release only reuses
# builds made the way it asked for.
run-name: Build archives${{ inputs.packages == 'none' && ' (no packages)' || '' }}
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "bundled: the archives carry the official packages; none: they do not (an rc before the packages are published)"
        type: choice
        options: [bundled, none]
        default: bundled
  workflow_call:
    inputs:
      sha:
        description: The commit to build
        type: string
        required: true
      packages:
        description: bundled or none
        type: string
        default: bundled

permissions:
  contents: read

jobs:
  # The host archives come from release-targets.json, the single source
  # of truth (release/publish.sh and scripts/check/targets.sh read it too).
  plan:
    name: Plan targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      sha: ${{ steps.targets.outputs.sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Read release-targets.json
        id: targets
        run: |
          echo "targets=$(jq -c '.targets' release-targets.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    name: Build archive (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 360
    env:
      NABI_DIST_PACKAGES: ${{ inputs.packages == 'none' && '0' || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # Native hosts (macOS, Windows x64 and arm64): dist/native.sh.
      - name: Set up the host environment
        uses: ./.github/actions/setup-host-env
        if: matrix.kind == 'native'
      - name: Install Rust from rust-toolchain.toml
        if: matrix.kind == 'native'
        run: rustup toolchain install && rustc -vV
      - name: Build the archive with dist/native.sh
        if: matrix.kind == 'native'
        shell: bash
        run: scripts/dist/native.sh --out "$PWD/dist"

      # Linux gnu/musl: the container scripts.
      - name: Build the archive with dist/gnu.sh
        if: matrix.kind == 'gnu'
        run: scripts/dist/gnu.sh --out "$PWD/dist"
      - name: Build the archive with dist/musl.sh
        if: matrix.kind == 'musl'
        run: scripts/dist/musl.sh --out "$PWD/dist"

      # FreeBSD: a VM under KVM (scripts/test/freebsd.sh).
      - name: Install qemu and enable KVM
        if: matrix.kind == 'freebsd'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the archive with dist/freebsd.sh
        if: matrix.kind == 'freebsd'
        run: scripts/dist/freebsd.sh --out "$PWD/dist"

      # The commit this build checked out; publish holds the tag to it.
      - name: Record the built commit
        shell: bash
        env:
          PACKAGES: ${{ inputs.packages || 'bundled' }}
        run: |
          git rev-parse HEAD > "dist/commit-${{ matrix.name }}"
          echo "$PACKAGES" > "dist/packages-${{ matrix.name }}"
      - name: Upload the dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  verify:
    name: Verify the archive set
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Download the dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check the built commit
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          PACKAGES: ${{ inputs.packages || 'bundled' }}
        run: scripts/release/dist.sh check dist "$SHA" "$PACKAGES"
      - name: Verify the set with publish.sh
        run: scripts/release/publish.sh --dir dist
