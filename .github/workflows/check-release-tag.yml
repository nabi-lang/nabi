name: Check / Release tag origin

# Release tags come from release.yml, created by the nabi-lang-release App.
# Any other v* tag raises the alarm issue; tags never move, so it stays
# until someone closes it with a note on what happened.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  tag-origin:
    name: Check who pushed the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Check the tag pusher
        id: who
        env:
          ACTOR: ${{ github.actor }}
        run: |
          ok=true
          [ "$ACTOR" = "nabi-lang-release[bot]" ] || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME pushed by $ACTOR"
      - name: Raise the alarm issue
        if: steps.who.outputs.ok == 'false'
        uses: nabi-lang/.github/actions/sync-alarm-issue@v1.0.2
        with:
          title: "Tag ${{ github.ref_name }} not created by release.yml"
          ok: "false"
          body: "${{ github.ref_name }} on ${{ github.sha }} was pushed by ${{ github.actor }}, not by the nabi-lang-release App. A tag never moves: check that it names the right commit and that a release was meant, then close this."
