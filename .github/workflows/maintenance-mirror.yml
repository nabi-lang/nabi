name: Maintenance / Mirror target sources

# Copy the third-party sources targets/build.sh downloads into the
# artifacts bucket (mirror/<sha256>), where its fetch() looks first.
# Runs when a pin changes on main; files already there are skipped.
on:
  push:
    branches: [main]
    paths:
      - targets/build.sh
      - scripts/mirror.sh
      - .github/workflows/maintenance-mirror.yml
  workflow_dispatch:

permissions:
  id-token: write # OIDC -> nabi-ci-artifacts
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror target sources to S3
    if: vars.NABI_ARTIFACTS_ROLE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NABI_ARTIFACTS_ROLE: the role ARN that may write the artifacts
      # bucket; unset, there is nothing to mirror into.
      - name: Configure AWS credentials for the artifacts bucket
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.NABI_ARTIFACTS_ROLE }}
          aws-region: us-east-1
      - name: Mirror the sources with mirror.sh
        run: scripts/mirror.sh
