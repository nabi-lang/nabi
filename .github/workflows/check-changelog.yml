name: Check / Release changelog

# The CHANGELOG section on a release branch, hand-written blocks included,
# on every push there (scripts/changelog/lint.sh). release-prepare.yml's own
# push does not trigger this; it runs the draft check itself.
on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  changelog:
    name: Lint the release changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The previous tag and the merged PRs come from the history.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint the changelog section with lint.sh
        env:
          BRANCH: ${{ github.ref_name }}
        run: scripts/changelog/lint.sh "${BRANCH#release/}"
