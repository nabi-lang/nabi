# A test that runs past 8 minutes is killed and fails, so a hang
# costs one job, not the 6 h job limit.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 8 }

# The corpus shards run hundreds of cases in one test; a slow Windows
# runner needs more than 8 minutes for one.
[[profile.default.overrides]]
filter = "binary_id(nabic::main) & test(/^integration::/)"
slow-timeout = { period = "60s", terminate-after = 15 }

# nabi's tests run the nabicc and nabils beside it, binaries of packages
# with no integration tests, which the archive leaves out: check builds
# them first. One suffix of each exists on a host.
[profile.default.archive]
include = [
    { path = "debug/nabicc", relative-to = "target", on-missing = "ignore" },
    { path = "debug/nabicc.exe", relative-to = "target", on-missing = "ignore" },
    { path = "debug/nabils", relative-to = "target", on-missing = "ignore" },
    { path = "debug/nabils.exe", relative-to = "target", on-missing = "ignore" },
]
